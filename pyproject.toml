[project]
name = "blindmind"
version = "0.1.0"
description = "Blind Variation and Selective Retention Evolutionary Algorithm CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "David Condrey", email = "davidcondrey@me.com" }]
keywords = ["evolutionary-algorithm", "llm", "cli", "concept-generation", "bvsr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.35.0",
    "sqlmodel>=0.0.18",
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.5.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blindmind*"]
exclude = ["data*", "conductor*", "tests*"]

[project.scripts]
blindmind = "blindmind.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607", "S108", "S105", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
