[project]
name = "blindmind"
version = "0.1.0"
description = "Blind Variation and Selective Retention Evolutionary Algorithm CLI"
authors = [
    { name = "BlindMind Developer" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.35.0",
    "sqlmodel>=0.0.18",
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.5.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blindmind*"]
exclude = ["data*", "conductor*", "tests*"]

[project.scripts]
blindmind = "blindmind.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
